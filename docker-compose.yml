services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lancamento-logistica-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OP_LOGISTICA_DATABASE_URL: ${OP_LOGISTICA_DATABASE_URL:-}
      OP_LOGISTICA_MIGRATION_DATABASE_URL: ${OP_LOGISTICA_MIGRATION_DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
