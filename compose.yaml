services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: op_logistica_dev
      MYSQL_USER: portal
      MYSQL_PASSWORD: portal_local_only
      MYSQL_ROOT_PASSWORD: root_local_only
    volumes:
      - logistica_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      API_PREFIX: /api/v1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SESSION_SECRET: local-development-secret-change-before-any-shared-environment
      SESSION_COOKIE_SECURE: "false"
      OP_LOGISTICA_DATABASE_URL: mysql+pymysql://portal:portal_local_only@db:3306/op_logistica_dev?charset=utf8mb4
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_DEMO_MODE: "false"
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  bootstrap:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      LOCAL_DEV_BOOTSTRAP: "1"
      SESSION_SECRET: local-development-secret-change-before-any-shared-environment
      OP_LOGISTICA_DATABASE_URL: mysql+pymysql://portal:portal_local_only@db:3306/op_logistica_dev?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    command: ["python", "-m", "scripts.local_dev_bootstrap"]
    stdin_open: true
    tty: true

volumes:
  logistica_db:
  frontend_node_modules:
